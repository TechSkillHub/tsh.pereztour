<!--
  Fonte da imagem de compartilhamento (public/og-image.jpg, 1200x630).
  Para regerar, a partir da raiz do projeto:
    chrome --headless=new --hide-scrollbars --allow-file-access-from-files --force-device-scale-factor=1 --window-size=1200,630 --screenshot=og.png design/og-image.html
    npx sharp-cli -i og.png -o . --format jpeg --quality 86 --mozjpeg
  Ao trocar a imagem, TROQUE TAMBEM O NOME do arquivo (e o caminho em
  utils/constants/generateMeta.ts): as plataformas guardam a previa pela URL.
-->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Montserrat";
    font-weight: 300 700;
    src: url("file:///C:/Users/TechSkillHub/Projetos/tsh.pereztour/public/fonts/montserrat-latin.woff2") format("woff2");
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #040926;
    font-family: "Montserrat", sans-serif;
    color: #e8ebf7;
  }
  /* linhas curvas do site, canto superior esquerdo */
  .vetor {
    position: absolute; top: -40px; left: -120px;
    width: 820px; opacity: .55;
  }
  /* peça-herói do Hero: mala com o P laranja */
  .heroi {
    position: absolute; right: -6px; bottom: -8px;
    height: 560px;
  }
  .texto {
    position: absolute; left: 80px; top: 0; bottom: 0;
    width: 640px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .logo { height: 92px; width: auto; align-self: flex-start; }
  h1 {
    margin-top: 44px;
    font-size: 47px; line-height: 1.08; font-weight: 700; white-space: nowrap;
    text-transform: uppercase; letter-spacing: -.5px;
  }
  .barra { margin-top: 30px; width: 72px; height: 6px; border-radius: 3px; background: #ff5714; }
  .servicos { margin-top: 26px; font-size: 22px; white-space: nowrap; font-weight: 400; color: #e8ebf7; }
  .url { margin-top: 12px; font-size: 22px; font-weight: 600; color: #05a8aa; letter-spacing: .3px; }
</style>
</head>
<body>
  <img class="vetor" src="file:///C:/Users/TechSkillHub/Projetos/tsh.pereztour/assets/images/vector1.png" alt="">
  <img class="heroi" src="file:///C:/Users/TechSkillHub/Projetos/tsh.pereztour/assets/images/banner.png" alt="">
  <div class="texto">
    <img class="logo" src="file:///C:/Users/TechSkillHub/Projetos/tsh.pereztour/assets/images/logo.png" alt="">
    <h1>Sonhar é realizar,<br>viajar é economizar</h1>
    <div class="barra"></div>
    <p class="servicos">Passagens, pacotes, hospedagem e gestão de milhas</p>
    <p class="url">pereztour.com.br</p>
  </div>
</body>
</html>
